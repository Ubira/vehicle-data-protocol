[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vdp-client"
version = "0.1.0"
description = "Vehicle Data Protocol (VDP) Client — AUTOSAR VDP-CM Proxy role"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "car-data-collection" }]
dependencies = ["vdp-common"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
vdp-client = "vdp_client.cli:main"
vdp-client-demo = "vdp_client.cli:demo"

[tool.setuptools.packages.find]
where = ["."]
include = ["vdp_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
