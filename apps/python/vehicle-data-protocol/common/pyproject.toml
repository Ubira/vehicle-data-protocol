[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vdp-common"
version = "0.1.0"
description = "Vehicle Data Protocol (VDP) — shared protocol core (codec, constants, header, builders, transport)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "car-data-collection" }]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vdp_common*"]
